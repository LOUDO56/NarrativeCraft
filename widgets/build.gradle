plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'multiloader-library'
}

version = widgets_version
ext.mavenPublishVersion = widgets_version

neoForge {
    neoFormVersion = neo_form_version
}

configurations {
    widgetsJava {
        canBeResolved = false
        canBeConsumed = true
    }
    widgetsResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    widgetsJava sourceSets.main.java.sourceDirectories.singleFile
    widgetsResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.register('checkWidgetsVersion') {
    def widgetsVersionSourceFile = file('src/main/java/fr/loudo/narrativecraft/widgets/NarrativeCraftWidgets.java')
    def declaredWidgetsVersion = widgets_version.toString()
    def declaredMajor = declaredWidgetsVersion.tokenize('.').first()

    inputs.file(widgetsVersionSourceFile)
    inputs.property('widgetsVersion', declaredWidgetsVersion)

    doLast {
        def matcher = widgetsVersionSourceFile.text =~ /VERSION\s*=\s*(\d+)/
        if (!matcher.find()) {
            throw new GradleException("Could not read NarrativeCraftWidgets.VERSION from ${widgetsVersionSourceFile}")
        }
        def sourceVersion = matcher.group(1)
        if (sourceVersion != declaredMajor) {
            throw new GradleException(
                    "widgets_version=${declaredWidgetsVersion} does not match NarrativeCraftWidgets.VERSION=${sourceVersion}. " +
                            "The major of widgets_version must equal NarrativeCraftWidgets.VERSION.")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkWidgetsVersion'
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn 'checkWidgetsVersion'
}
